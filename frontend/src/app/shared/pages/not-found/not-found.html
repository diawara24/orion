<main class="not-found" aria-labelledby="not-found-title">
  <img class="not-found__logo" src="/logo.png" alt="Orion" />

  <p class="not-found__code" aria-hidden="true">404</p>
  <h1 id="not-found-title">Page introuvable</h1>
  <p class="not-found__message">La page que vous recherchez n’existe pas ou n’est plus disponible.</p>

  <a class="not-found__action" [routerLink]="isAuthenticated() ? '/feed' : '/'">
    {{ isAuthenticated() ? 'Retour au fil d’actualité' : 'Retour à l’accueil' }}
  </a>
</main>
