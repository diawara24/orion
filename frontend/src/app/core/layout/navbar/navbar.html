<header class="navbar">
  <a class="navbar__brand" [routerLink]="isAuthenticated() ? '/feed' : '/'" aria-label="Orion">
    <img src="/logo.png" alt="Orion" />
  </a>

  <nav class="navbar__desktop-navigation" aria-label="Navigation principale">
    @if (currentUser()) {
    <button type="button" class="navbar__logout" (click)="logout()">Se déconnecter</button>
    <a routerLink="/feed" routerLinkActive="navbar__link--active">Articles</a>
    <span class="navbar__static-link">Thèmes</span>
    <button type="button" class="navbar__profile" aria-label="Consulter mon profil">
      <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
    </button>
    } @else {
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="navbar__link--active">Accueil</a>
    <a routerLink="/login" routerLinkActive="navbar__link--active">Se connecter</a>
    <a class="navbar__register-link" routerLink="/register">S’inscrire</a>
    }
  </nav>

  <details class="navbar__mobile-menu">
    <summary aria-label="Ouvrir le menu de navigation">
      <span class="material-symbols-outlined navbar__menu-icon" aria-hidden="true">menu</span>
      <span class="material-symbols-outlined navbar__close-icon" aria-hidden="true">close</span>
    </summary>

    <div class="navbar__mobile-panel">
      <nav aria-label="Navigation mobile">
        @if (currentUser()) {
        <button type="button" class="navbar__logout" (click)="logout()">Se déconnecter</button>
        <a routerLink="/feed">Articles</a>
        <span class="navbar__static-link">Thèmes</span>
        <button type="button" class="navbar__profile" aria-label="Consulter mon profil">
          <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
        </button>
        } @else {
        <a routerLink="/">Accueil</a>
        <a routerLink="/login">Se connecter</a>
        <a routerLink="/register">S’inscrire</a>
        }
      </nav>
    </div>
  </details>
</header>
