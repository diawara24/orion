server:
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    url: /api/v1/openapi.yaml

spring:
  devtools:
    restart:
      enabled: false
  application:
    name: orion-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  messages:
    basename: messages
    encoding: UTF-8

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      issuer: ${JWT_ISSUER:orion-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT3H15M}
      key-id: ${JWT_KEY_ID:orion-key-1}
      secret: ${JWT_SECRET}
