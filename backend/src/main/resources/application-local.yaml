spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
      key-id: ${JWT_KEY_ID}
      secret: ${JWT_SECRET}
